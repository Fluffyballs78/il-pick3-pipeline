name: Ingest IL Pick 3 (Backfill)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Force reset dataset artifacts (backfill mode)
        shell: bash
        run: |
          rm -f data/pick3.sqlite data/pick3.csv
          rm -f data/odds_board_latest.json data/model_drought_lift.json data/model_repeat_regime.json data/model_backtest_top4_summary.json data/next_draw_report.md || true
          ls -la data || true

      - name: Run full historical ingest
        env:
          START_DATE: "2010-01-01"
          DB_PATH: "data/pick3.sqlite"
          CSV_PATH: "data/pick3.csv"
        run: |
          echo "[backfill] START_DATE=$START_DATE"
          python ingest_pick3.py

      - name: Build odds board + backtest summary
        env:
          DB_PATH: "data/pick3.sqlite"
          OUT_DIR: "data"
        run: |
          python build_odds_board.py

      - name: Generate ChatGPT play card
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: "gpt-4.1-mini"
          ODDS_PATH: "data/odds_board_latest.json"
          OUT_PATH: "data/next_draw_report.md"
        run: |
          python generate_play_card.py

      - name: Commit & push if changed
        shell: bash
        run: |
          git config user.name pick3-bot
          git config user.email pick3-bot@users.noreply.github.com

          git add data/pick3.sqlite \
                  data/pick3.csv \
                  data/odds_board_latest.json \
                  data/model_drought_lift.json \
                  data/model_repeat_regime.json \
                  data/model_backtest_top4_summary.json \
                  data/next_draw_report.md

          git diff --cached --quiet && echo "No changes" && exit 0

          git commit -m "Backfill rebuild: dataset + odds + play card"
          git push
