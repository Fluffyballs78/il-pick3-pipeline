name: Ingest IL Pick 3 (Backfill)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run one-time backfill
        env:
          START_DATE: "2025-09-01"
          DB_PATH: "data/pick3.sqlite"
          CSV_PATH: "data/pick3.csv"
        run: python ingest_pick3.py

      - name: Commit populated dataset
        run: |
          git config user.name "pick3-bot"
          git config user.email "pick3-bot@users.noreply.github.com"
          git add data/pick3.sqlite data/pick3.csv
          git commit -m "Backfill Illinois Pick 3 dataset" || echo "No changes to commit"
          git push
