name: Ingest IL Pick 3 (Backfill)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Force reset dataset artifacts (backfill mode)
        run: |
          rm -f data/pick3.sqlite data/pick3.csv
          ls -la data || true

      - name: Run full historical backfill
        env:
          START_DATE: "2010-01-01"
          DB_PATH: "data/pick3.sqlite"
          CSV_PATH: "data/pick3.csv"
        run: |
          echo "[workflow] START_DATE=$START_DATE"
          echo "[workflow] DB_PATH=$DB_PATH"
          echo "[workflow] CSV_PATH=$CSV_PATH"
          python ingest_pick3.py
          echo "[workflow] CSV line count:"
          wc -l data/pick3.csv || true

      - name: Commit populated dataset
        run: |
          git config user.name "pick3-bot"
          git config user.email "pick3-bot@users.noreply.github.com"
          git add data/pick3.sqlite data/pick3.csv
          git status
          git commit -m "Full historical backfill: Illinois Pick 3" || echo "No changes to commit"
          git push
