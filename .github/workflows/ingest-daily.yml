name: Ingest IL Pick 3 (Daily)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run ingest
        env:
          START_DATE: "2010-01-01"
          DB_PATH: "data/pick3.sqlite"
          CSV_PATH: "data/pick3.csv"
        run: |
          python ingest_pick3.py

      - name: Run odds model
        env:
          DB_PATH: "data/pick3.sqlite"
          OUT_DIR: "data"
        run: |
          python build_odds_board.py

      - name: Commit changes
        run: |
          git config user.name "pick3-bot"
          git config user.email "pick3-bot@users.noreply.github.com"
          git add data/*
          git commit -m "Manual ingest + model run" || echo "No changes"
          git push
