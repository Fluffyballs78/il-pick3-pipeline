name: Ingest IL Pick 3 (Scheduled)

on:
  schedule:
    # GitHub Actions cron runs in UTC and may start late.
    # Option A: Keep 9:45 PM America/Chicago target with backups.
    #
    # 1:00 PM America/Chicago
    - cron: "0 19 * * *"  # 1:00 PM CST
    - cron: "0 18 * * *"  # 1:00 PM CDT
    #
    # 9:45 PM America/Chicago (primary)
    - cron: "45 3 * * *"  # 9:45 PM CST
    - cron: "45 2 * * *"  # 9:45 PM CDT
    #
    # Backup runs
    - cron: "0 4 * * *"   # 10:00 PM CST
    - cron: "0 3 * * *"   # 10:00 PM CDT
    - cron: "15 4 * * *"  # 10:15 PM CST
    - cron: "15 3 * * *"  # 10:15 PM CDT
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pick3-daily
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compute START_DATE from DB (fallback to 2010-01-01)
        id: startdate
        shell: bash
        run: |
          if [ -f data/pick3.sqlite ]; then
            LAST=$(python -c "import sqlite3; con=sqlite3.connect('data/pick3.sqlite'); cur=con.cursor(); cur.execute('select max(draw_date) from pick3_draws'); v=cur.fetchone()[0]; con.close(); print(v if v else '')")
          else
            LAST=""
          fi

          if [ -z "$LAST" ]; then
            echo "start_date=2010-01-01" >> $GITHUB_OUTPUT
          else
            echo "start_date=$LAST" >> $GITHUB_OUTPUT
          fi

      - name: Run ingest
        env:
          START_DATE: ${{ steps.startdate.outputs.start_date }}
          DB_PATH: "data/pick3.sqlite"
          CSV_PATH: "data/pick3.csv"
        run: |
          echo "[daily] START_DATE=$START_DATE"
          python ingest_pick3.py

      # -----------------------------
      # TEMPORARY STRUCTURAL ANALYSIS
      # -----------------------------
      - name: Run repeat analysis SQL
        shell: bash
        run: |
          python -c "import sqlite3; con=sqlite3.connect('data/pick3.sqlite'); cur=con.cursor(); cur.execute(\"WITH ordered AS ( SELECT draw_date, draw_time, pick3_d1, pick3_d2, pick3_d3, fireball, ROW_NUMBER() OVER ( ORDER BY draw_date, CASE WHEN draw_time='MIDDAY' THEN 0 ELSE 1 END ) AS rn FROM pick3_draws ), pairs AS ( SELECT a.rn, a.pick3_d1, a.pick3_d2, a.pick3_d3, a.fireball, b.pick3_d1 AS n_d1, b.pick3_d2 AS n_d2, b.pick3_d3 AS n_d3, b.fireball AS n_fb FROM ordered a JOIN ordered b ON b.rn = a.rn + 1 ) SELECT SUM( (CASE WHEN n_d1 IN (pick3_d1,pick3_d2,pick3_d3,fireball) THEN 1 ELSE 0 END) + (CASE WHEN n_d2 IN (pick3_d1,pick3_d2,pick3_d3,fireball) THEN 1 ELSE 0 END) + (CASE WHEN n_d3 IN (pick3_d1,pick3_d2,pick3_d3,fireball) THEN 1 ELSE 0 END) + (CASE WHEN n_fb IN (pick3_d1,pick3_d2,pick3_d3,fireball) THEN 1 ELSE 0 END) ) AS total_repeats, COUNT(*) AS total_transitions FROM pairs;\"); r=cur.fetchone(); con.close(); print('TOTAL REPEATS:', r[0]); print('TOTAL TRANSITIONS:', r[1])"

      - name: Build odds board + backtest summary
        env:
          DB_PATH: "data/pick3.sqlite"
          OUT_DIR: "data"
        run: |
          python build_odds_board.py

      - name: Update live performance log
        env:
          DB_PATH: "data/pick3.sqlite"
          OUT_DIR: "data"
          LIVE_LOG_PATH: "data/live_performance_log.csv"
        run: |
          python live_performance_log.py

      - name: Build previous draw recap (model top4 + hits)
        env:
          LIVE_LOG_PATH: "data/live_performance_log.csv"
          ODDS_PATH: "data/odds_board_latest.json"
          PREV_RECAP_PATH: "data/prev_draw_recap.json"
        run: |
          python build_prev_recap.py

      - name: Build live summary
        env:
          OUT_DIR: "data"
          LIVE_LOG_PATH: "data/live_performance_log.csv"
          LIVE_SUMMARY_PATH: "data/live_summary.json"
        run: |
          python live_summary.py

      - name: Build user play recap (your plays vs last draw)
        env:
          OUT_DIR: "data"
          DB_PATH: "data/pick3.sqlite"
          ODDS_PATH: "data/odds_board_latest.json"
          USER_PLAY_RECAP_PATH: "data/user_play_recap.json"
        run: |
          python build_user_play_recap.py

      - name: Commit & push if changed
        shell: bash
        run: |
          git config user.name pick3-bot
          git config user.email pick3-bot@users.noreply.github.com

          git add \
            data/pick3.sqlite \
            data/pick3.csv \
            data/odds_board_latest.json \
            data/model_drought_lift.json \
            data/model_repeat_regime.json \
            data/model_backtest_top4_summary.json \
            data/live_performance_log.csv \
            data/prev_draw_recap.json \
            data/live_summary.json \
            data/user_plays.csv \
            data/user_play_recap.json

          git diff --cached --quiet && echo "No changes" && exit 0

          git commit -m "Scheduled ingest + state update"
          git pull --rebase origin main
          git push origin main
